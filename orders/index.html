<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#8b4b24"><title>Crazy Caramels Orders</title>
<style>
:root{--caramel:#c67d3b;--brown:#6b351b;--dark:#3d2115;--cream:#fff3df;--paper:#fffaf1;--gold:#f1c477;--green:#3f7148}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:var(--cream);color:var(--dark);touch-action:pan-x pan-y}
body{display:flex;flex-direction:column}.top{height:76px;flex:none;background:var(--brown);color:white;display:flex;align-items:center;justify-content:center;padding:8px 18px;text-align:center}.top h1{font-size:clamp(22px,3vw,34px);margin:0;letter-spacing:.3px}.top p{margin:3px 0 0;color:#ffe0b4;font-size:13px}
.products{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px;overflow:hidden}
.product{background:var(--paper);border:3px solid var(--brown);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0;padding:10px;box-shadow:0 4px 0 #d7b28a}
.product img{width:100%;height:min(27vh,220px);object-fit:contain;border-radius:12px;background:#fff}
.name{font-size:clamp(15px,2.2vw,23px);font-weight:800;text-align:center;margin:6px 0 2px}.price{font-weight:800;color:var(--brown);font-size:clamp(15px,2vw,21px)}
.controls{display:flex;align-items:center;justify-content:center;gap:clamp(7px,1.5vw,16px);width:100%;margin:5px 0 2px}
.step{width:clamp(46px,7vw,68px);height:clamp(46px,7vw,68px);border:0;border-radius:14px;background:var(--caramel);color:white;font-size:clamp(28px,4vw,40px);font-weight:800;box-shadow:0 4px 0 var(--brown);touch-action:manipulation}
.step:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}.qty{font-size:clamp(25px,4vw,38px);font-weight:900;min-width:35px;text-align:center;font-variant-numeric:tabular-nums}
.bottom{height:112px;flex:none;background:#f0d3ad;border-top:3px solid var(--brown);display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:16px}
.total-label{font-size:14px;text-transform:uppercase;font-weight:800;color:var(--brown);letter-spacing:1px}.total{font-size:clamp(32px,5vw,48px);font-weight:900;line-height:1.05}
.place{height:72px;min-width:48%;border:0;border-radius:16px;background:var(--green);color:white;font-size:clamp(20px,3vw,30px);font-weight:900;box-shadow:0 5px 0 #24482b;touch-action:manipulation}.place:disabled{opacity:.45;box-shadow:none}
.notice{position:fixed;inset:0;background:#fff3df;display:none;z-index:5;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}.notice.show{display:flex}.notice h2{font-size:clamp(32px,6vw,58px);margin:0 0 10px;color:var(--brown)}.notice .big{font-size:clamp(48px,10vw,90px);font-weight:900;margin:12px}.notice button{margin-top:20px;border:0;border-radius:15px;padding:18px 35px;background:var(--green);color:#fff;font-size:24px;font-weight:800}
.dashboard{display:none;flex:1;min-height:0;overflow:auto;padding:20px}.dashboard h2{margin:0 0 12px;color:var(--brown)}.dashbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.orders{display:grid;gap:10px}.order{background:var(--paper);border:2px solid #d2a16e;border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.order strong{font-size:20px}.order small{display:block;color:#76533d;margin-top:4px}.order button{border:0;border-radius:10px;padding:12px 15px;background:var(--green);color:white;font-weight:800}.empty{font-size:20px;color:#795a43;padding:30px;text-align:center;background:var(--paper);border-radius:14px}
body.dash .top{height:68px}body.dash .products,body.dash .bottom{display:none}body.dash .dashboard{display:block}
@media(max-height:650px){.top{height:58px}.products{padding:7px;gap:7px}.product{padding:6px}.product img{height:22vh}.bottom{height:88px}.place{height:60px}}
@media(max-width:520px){.products{gap:6px;padding:6px}.product{padding:5px;border-width:2px;border-radius:12px}.product img{height:23vh}.bottom{padding:8px;gap:8px}.place{min-width:50%;font-size:19px}.name{font-size:14px}}
</style></head><body>

</main>
<footer class="bottom" id="checkout"><div><div class="total-label">Your total</div><div class="total" id="total">$0.00</div></div><button class="place" id="place" disabled>PLACE ORDER</button></footer>
<section class="notice" id="thanks"><h2>Order placed! 🎉</h2><div>YOUR TOTAL</div><div class="big" id="thanksTotal">$0.00</div><p>Thank you for shopping Crazy Caramels!</p><button id="newOrder">Start New Order</button></section>
<section class="dashboard" id="dashboard"><div class="dashbar"><div><h2>Live Orders</h2><div id="connection">Connecting…</div></div><button id="refresh" class="step" style="width:auto;height:auto;padding:12px;font-size:16px">Refresh</button></div><div id="orders" class="orders"><div class="empty">Waiting for the first order…</div></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* SETUP: paste your Supabase Project URL and anon key here after creating the database. */
const SUPABASE_URL="PASTE_SUPABASE_PROJECT_URL_HERE";
const SUPABASE_ANON_KEY="PASTE_SUPABASE_ANON_KEY_HERE";
const configured=SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.startsWith("ey");
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const prices={single:1,bag:6,mint:1},names={single:"Single Caramel",bag:"Gift Bag (5)",mint:"Peppermint Caramel"};
let qty={single:0,bag:0,mint:0};
const money=n=>"$"+n.toFixed(2);
function total(){return qty.single+qty.mint+qty.bag*6}
function paint(){for(const k in qty)document.getElementById("q-"+k).textContent=qty[k];document.getElementById("total").textContent=money(total());document.getElementById("place").disabled=total()===0}
document.querySelectorAll("[data-change]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.change;qty[k]=Math.max(0,Math.min(99,qty[k]+Number(b.dataset.delta)));paint()}));
document.getElementById("place").addEventListener("click",async()=>{
 if(!db){alert("Orders aren't connected yet. The site owner needs to finish the one-time database setup.");return}
 const items=Object.fromEntries(Object.entries(qty).filter(([,v])=>v>0));
 const totalPrice=total();const btn=document.getElementById("place");btn.disabled=true;btn.textContent="SENDING…";
 const {error}=await db.from("orders").insert({items,total:totalPrice,status:"new"});
 btn.textContent="PLACE ORDER";if(error){alert("Couldn't send the order. Please try again.");paint();return}
 document.getElementById("thanksTotal").textContent=money(totalPrice);document.getElementById("thanks").classList.add("show");
});
document.getElementById("newOrder").addEventListener("click",()=>{qty={single:0,bag:0,mint:0};paint();document.getElementById("thanks").classList.remove("show")});
async function loadOrders(){
 if(!db){document.getElementById("connection").textContent="Database setup needed";document.getElementById("orders").innerHTML='<div class="empty">Connect the database to start receiving orders.</div>';return}
 document.getElementById("connection").textContent="Connected · updates automatically";
 const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(100);
 if(error){document.getElementById("connection").textContent="Could not load orders";return}
 renderOrders(data||[]);
}
function renderOrders(rows){const el=document.getElementById("orders");if(!rows.length){el.innerHTML='<div class="empty">Waiting for the first order…</div>';return}
 el.innerHTML=rows.map(o=>{const lines=Object.entries(o.items||{}).filter(([,n])=>n>0).map(([k,n])=>n+" × "+names[k]).join(" · ");const date=new Date(o.created_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});return '<article class="order"><div><strong>'+money(Number(o.total))+'</strong><small>'+lines+'</small><small>'+date+' · '+o.status+'</small></div><button data-done="'+o.id+'" '+(o.status==="done"?"disabled":"")+'>'+(o.status==="done"?"Completed":"Mark completed")+'</button></article>'}).join("");
 el.querySelectorAll("[data-done]").forEach(b=>b.addEventListener("click",async()=>{await db.from("orders").update({status:"done"}).eq("id",b.dataset.done);loadOrders()}));
}
document.getElementById("refresh").addEventListener("click",loadOrders);
if(new URLSearchParams(location.search).get("view")==="dashboard"){document.body.classList.add("dash");document.getElementById("subtitle").textContent="Order dashboard";loadOrders();if(db){db.channel("orders-live").on("postgres_changes",{event:"*",schema:"public",table:"orders"},loadOrders).subscribe();setInterval(loadOrders,5000)}}else{paint()}
</script></body></html>
